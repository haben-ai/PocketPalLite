name: iOS App Store release

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14
    env:
      TEAM_ID: 54L8KA2YV2
      PROFILE_NAME: "Zayla App Store"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      # xcodebuild/altool auto-discover an App Store Connect API key from
      # this exact directory + filename convention -- still needed for the
      # final upload step (that part worked fine), even though it's no
      # longer used for signing (see below).
      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      # Manual signing instead of Xcode's "cloud-managed" automatic
      # certificate creation -- that path failed with "Cloud signing
      # permission error", which Apple gates behind an extra, undocumented
      # account permission that (per Apple's own error message) only an
      # Account Holder/Admin can grant, and which in practice usually needs
      # a one-time interactive Xcode session to unlock -- not possible
      # without a Mac. A manually-created Distribution certificate +
      # provisioning profile has none of that gating; it's the same method
      # CI pipelines have used for years.
      - name: Import signing certificate into a temporary keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERT_PATH="$RUNNER_TEMP/distribution.p12"

          echo "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/Zayla_App_Store.mobileprovision

      - name: Archive (manual signing)
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace PocketPalLite.xcworkspace \
            -scheme PocketPalLite \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/PocketPalLite.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Write export options
        working-directory: ios
        run: |
          cat > ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.zayla.app</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export signed .ipa
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/PocketPalLite.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to App Store Connect
        working-directory: ios
        run: |
          xcrun altool --upload-app \
            -f build/export/PocketPalLite.ipa \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      # Kept as a downloadable artifact too -- if the CLI upload step above
      # ever fails (Apple's upload tooling has a history of transient
      # flakiness), this .ipa can still be uploaded manually via the
      # Transporter app without re-running the whole archive/export.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PocketPalLite-appstore-ipa
          path: ios/build/export/PocketPalLite.ipa
          retention-days: 14

      - name: Clean up temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
