name: iOS unsigned build (AltStore sideload)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build unsigned .app for a generic iOS device
        working-directory: ios
        run: |
          xcodebuild \
            -workspace PocketPalLite.xcworkspace \
            -scheme PocketPalLite \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package as .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/PocketPalLite.app" Payload/
          zip -r PocketPalLite-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PocketPalLite-unsigned-ipa
          path: ios/PocketPalLite-unsigned.ipa
          retention-days: 14
